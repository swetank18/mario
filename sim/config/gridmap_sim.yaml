# Grid map / planner parameters for the Webots sim.
# Schema is what nav::loadMapParams() and nav::loadPlannerParams() in
# src/nav/params.cpp read. Every key is optional now -- a missing one falls
# back to the default in include/nav/params.hpp instead of throwing.

grid_map:
  # setGeometry() centres the map on the origin, so this spans [-10, 10] on
  # both axes, and the planner reads the same extents back through
  # MapQuery::bounds(). The map is never recentred though -- see known issue 1
  # in sim/README.md, which is why this is not large enough to reach the 14 m
  # first waypoint.
  x: 20.0
  y: 20.0
  resolution: 0.10
  min_grid_points: 3
  pos_obstacle_threshold: 0.25
  neg_obstacle_threshold: -0.25
  # Cells the depth camera has never seen. false lets the planner route through
  # them, which is what the old map did by accident -- it initialised elevation
  # to 0.0, so unobserved ground read as flat. With one forward-facing D435i,
  # true refuses most goals until coverage improves. Team call, not a default
  # to flip casually.
  unknown_is_occupied: false
  # How much of a cell's stored elevation survives a fresh look at it. The map
  # used to keep the most extreme value ever written, so anything that moved
  # through the scene left a wall that only a restart cleared.
  elevation_retain: 0.6
  # Integrations a cell may go unobserved before it reverts to unknown.
  forget_after: 40
  # Graded cost for ground that is passable but not flat, for the three bands
  # below pos_obstacle_threshold h: (h/2, h], (h/4, h/2], flatter than h/4.
  # Same bands PathPlanning-Astar's create_gridmap uses.
  rough_cost: [5.0, 1.0, 0.0]

# Where the depth sensor sits in the rover's base FLU frame, in metres:
# x forward, y left, z above the wheel contact plane.
#
# MarioRover.proto mounts the camera and range-finder at "0.40 0 0.62", and the
# wheel anchors sit at z 0.15 with radius 0.15, so the body origin is exactly
# at ground level and 0.62 is a true height above the contact plane.
#
# This was implicitly {0, 0, 0} until now, which is why every ground return
# landed at -0.62 m and the whole visible course mapped as a ditch. Measure it
# on the real rover before a field run -- it is not the same mast.
sensor:
  offset:
    x: 0.40
    y: 0.0
    z: 0.62

# Re-measure the ground plane from each cloud and threshold relative to it,
# rather than trusting z = 0 to be the ground. Rough terrain and SLAM z-drift
# both move the apparent plane by more than the 0.25 m obstacle threshold.
ground:
  estimate: true
  window: 5.0        # metres around the rover that count as ground candidates
  max_height: 0.25   # candidates above this are obstacles, not ground

filters:
  min_filtering_points: 100
  # Applied after the cloud is transformed into the base FLU frame:
  # x forward, y left, z up.
  passthrough_filter:
    x:
      min_limit: 0.3
      max_limit: 10.0
    y:
      min_limit: -5.0
      max_limit: 5.0
    z:
      min_limit: -1.0
      max_limit: 2.0
  voxel_size:
    x: 0.05
    y: 0.05
    z: 0.05

planner:
  # Only the sampling planner (OmplPlanner) spends this; A* is not timed.
  time_to_solve: 1.0
  # METRES from the path to the nearest obstacle. Was effectively a count of
  # grid cells before, so check this one against the rover's real footprint.
  safety_margin: 0.35
  goal_tolerance: 0.15
  # How hard to push the path away from obstacles once it already clears them
  # by safety_margin. 0 gives the shortest route regardless of how close it
  # shaves; higher hugs the middle of the gap.
  obstacle_cost_weight: 2.0
  # How much a cell's graded terrain cost counts against the metres it takes to
  # cross it. 0 ignores roughness and plans the shortest clear line.
  terrain_cost_weight: 0.2
  # Flat surcharge, in metres-equivalent, for a step that changes heading.
  # Without it A* staircases across open ground and traverse_path re-aims the
  # rover on every cell.
  turn_penalty: 0.1
