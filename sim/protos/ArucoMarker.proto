# documentation url: https://github.com/swetank18/mario
# tags: static
# An ArUco marker board on a post, for GPS_ARUCO waypoints.
#
# The face is an explicit IndexedFaceSet quad rather than a Box or Plane so the
# texture orientation and winding are unambiguous -- a mirrored marker simply
# will not decode. The quad faces -X, so a rover approaching from -X reads it
# the right way round. Texture must be one of sim/textures/aruco_<id>.png,
# generated from DICT_4X4_50 to match search_aruco() in src/mario.cpp.
#
# Geometry is fixed rather than templated: a 0.60 m board whose lower edge sits
# 0.75 m off the ground, so the board spans z = 0.75 .. 1.35 and is centred at
# 1.05, roughly level with the rover's 0.62 m camera at a few metres out.

PROTO ArucoMarker [
  field SFVec3f    translation 0 0 0
  field SFRotation rotation    0 0 1 0
  field SFString   name        "aruco marker"
  # MFString, not SFString: ImageTexture.url is a multi-field, and an IS
  # reference cannot appear inside a literal list.
  field MFString   texture     [ "../textures/aruco_0.png" ]
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    model "ArUco marker"
    children [
      # support post, 0.75 m tall
      Pose {
        translation 0 0 0.375
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.35 0.33 0.30
              roughness 0.9
              metalness 0
            }
            geometry Cylinder {
              radius 0.03
              height 0.75
              subdivision 12
            }
          }
        ]
      }
      # marker face, 0.60 m square, normal pointing -X
      Pose {
        translation 0 0 1.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColorMap ImageTexture {
                url IS texture
                filtering 0
              }
              roughness 1
              metalness 0
            }
            geometry IndexedFaceSet {
              coord Coordinate {
                point [
                  0 0.3 -0.3
                  0 -0.3 -0.3
                  0 -0.3 0.3
                  0 0.3 0.3
                ]
              }
              texCoord TextureCoordinate {
                point [
                  0 0
                  1 0
                  1 1
                  0 1
                ]
              }
              coordIndex [
                0 1 2 3 -1
              ]
              texCoordIndex [
                0 1 2 3 -1
              ]
              creaseAngle 0
            }
          }
        ]
      }
    ]
    boundingObject Pose {
      translation 0 0 0.375
      children [
        Cylinder {
          radius 0.05
          height 0.75
        }
      ]
    }
  }
}
